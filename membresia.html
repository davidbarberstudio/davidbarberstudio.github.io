<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DBM - Membresía VIP</title>
  <link rel="manifest" href="https://davidbarberstudio.github.io/manifest-membresia.json">
  <meta name="theme-color" content="#C9A96E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DBM VIP">
  <link rel="icon" href="https://davidbarberstudio.github.io/dbm-icon-512.png">
  <link rel="apple-touch-icon" href="https://davidbarberstudio.github.io/dbm-icon-512.png">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; background: #000; }
    body { font-family: 'Montserrat', sans-serif; color: #fff; min-height: 100vh; padding-bottom: 120px; }
    .app { width: 100%; padding: 28px 20px; max-width: 800px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 30px; padding-bottom: 24px; border-bottom: 3px solid #C9A96E; }
    .logo { width: 120px; border-radius: 16px; margin-bottom: 8px; }
    .buscador { display: flex; gap: 12px; margin-bottom: 24px; }
    .buscador input { flex: 1; padding: 18px 20px; border-radius: 16px; border: 2px solid #C9A96E; background: #111; color: #fff; font-size: 16px; }
    .btn-buscar { padding: 18px 24px; border-radius: 16px; border: 2px solid #C9A96E; background: #C9A96E; color: #000; font-weight: 700; font-size: 20px; }
    .filtros { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 28px; }
    .filtro { padding: 14px 10px; border-radius: 30px; border: 2px solid #333; background: #111; color: #888; font-size: 14px; font-weight: 700; }
    .filtro.activo { background: #C9A96E; color: #000; border-color: #C9A96E; }
    .card-cliente { background: #0a0a0a; border: 2px solid #C9A96E; border-radius: 20px; padding: 22px; margin-bottom: 18px; box-shadow: 0 0 20px rgba(201,169,110,0.15); }
    .nombre { font-family: 'Cinzel', serif; font-weight: 700; font-size: 22px; color: #C9A96E; display: inline-block; max-width: 65%; }
    .paquete { font-size: 13px; color: #aaa; margin-bottom: 12px; }
    .status { float: right; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .ACTIVO { background: #198754; } .PORVENCER { background: #FF8C00; color: #000; } .VENCIDO { background: #dc3545; }
    .whatsapp { color: #25D366; text-decoration: none; font-size: 14px; display: block; margin-bottom: 14px; font-weight: 600; }
    .dato { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; font-weight: 600; }
    .cortes-num { font-size: 28px; color: #C9A96E; font-weight: 700; }
    .vencimiento { font-size: 12px; color: #999; margin-bottom: 18px; }
    .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-accion { padding: 16px; border-radius: 14px; border: none; font-size: 15px; font-weight: 700; }
    .btn-corte { background: #198754; color: #fff; } .btn-renovar { background: #C9A96E; color: #000; }
    .btn-accion:disabled { background: #333; color: #666; }
    .fab { position: fixed; bottom: 24px; right: 20px; width: 64px; height: 64px; border-radius: 50%; background: #C9A96E; color: #000; border: 3px solid #000; font-size: 36px; box-shadow: 0 8px 30px rgba(201,169,110,0.7); z-index: 15; }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.92); z-index: 20; padding: 20px; overflow-y: auto; }
    .modal.activo { display: flex; align-items: center; justify-content: center; }
    .modal-card { background: #0a0a0a; border: 2px solid #C9A96E; border-radius: 20px; padding: 28px 22px; width: 100%; max-width: 500px; }
    .modal-card h3 { font-family: 'Cinzel', serif; color: #C9A96E; margin-bottom: 24px; text-align: center; font-size: 22px; }
    .modal-card input, .modal-card select { width: 100%; padding: 16px; margin: 10px 0; border-radius: 12px; border: 2px solid #C9A96E; background: #000; color: #fff; font-size: 16px; }
    .modal-botones { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
    .btn-guardar { background: #198754; color: #fff; padding: 16px; border: none; border-radius: 12px; font-weight: 700; }
    .btn-cancelar { background: #333; color: #fff; padding: 16px; border: none; border-radius: 12px; font-weight: 700; }
    .vacio { text-align: center; padding: 80px 20px; color: #666; }
    .vacio-emoji { font-size: 60px; margin-bottom: 20px; } .vacio-texto { font-size: 16px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <img src="https://davidbarberstudio.github.io/dbm-icon-512.png" class="logo" alt="DBM">
      <div style="font-family:'Cinzel';color:#C9A96E;font-size:38px;letter-spacing:6px">DBM</div>
      <div style="font-size:12px;letter-spacing:4px;color:#888">MEMBRESÍA VIP</div>
    </div>
    <div class="buscador">
      <input type="text" id="busca" placeholder="Buscar cliente" oninput="filtrar()">
      <button class="btn-buscar" onclick="filtrar()">🔍</button>
    </div>
    <div class="filtros">
      <button class="filtro activo" onclick="cambiarFiltro('TODOS', this)">Todos</button>
      <button class="filtro" onclick="cambiarFiltro('PORVENCER', this)">Por Vencer</button>
      <button class="filtro" onclick="cambiarFiltro('VENCIDO', this)">Vencidos</button>
    </div>
    <div id="listaClientes"></div>
  </div>
  <button class="fab" onclick="abrirModal()">+</button>
  <div id="modalNuevo" class="modal">
    <div class="modal-card">
      <h3>Nuevo Cliente DBM</h3>
      <input id="nome" placeholder="Nombre completo">
      <input id="tel" placeholder="WhatsApp" type="tel">
      <select id="tipo">
        <option value="Mensal 5 cortes">Mensal 5 cortes - 5 cortes / 30 dias</option>
        <option value="Promo 3 cortes">Promo 3 cortes - 3 cortes / 30 dias</option>
      </select>
      <input id="obs" placeholder="Observaciones">
      <div class="modal-botones">
        <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-guardar" onclick="nuevoCliente()">Guardar</button>
      </div>
    </div>
  </div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz8JaNuoYU7FQdswXy9p_sxROUVyoZZfMbJD4qzQBTlmATkPJB3wYltTmIiMrX4-PICOQ/exec";
let clientes = [], config = {}, filtroActual = 'TODOS';
async function api(action, data={}) {
  const url = `${SCRIPT_URL}?action=${action}&data=${encodeURIComponent(JSON.stringify(data))}&t=${Date.now()}`;
  const r = await fetch(url);
  return await r.json();
}
async function cargar() {
  config = await api('getConfig');
  const p1 = config.Paquete_1_Nombre || 'Mensal 5 cortes';
  const p2 = config.Paquete_2_Nombre || 'Promo 3 cortes';
  document.getElementById('tipo').innerHTML = `<option value="${p1}">${p1}</option><option value="${p2}">${p2}</option>`;
  clientes = await api('getClientes');
  mostrarClientes();
}
function mostrarClientes() {
  const div = document.getElementById('listaClientes');
  let lista = clientes;
  const txt = document.getElementById('busca').value.toLowerCase().trim();
  if(txt) lista = lista.filter(c => c.Nombre.toLowerCase().includes(txt));
  if(filtroActual !== 'TODOS') lista = lista.filter(c => c.Estado === filtroActual);
  if(lista.length === 0) { div.innerHTML = `<div class="vacio"><div class="vacio-emoji">💈</div><div class="vacio-texto">No hay clientes</div></div>`; return; }
  div.innerHTML = lista.map(c => `<div class="card-cliente"><div class="nombre">${c.Nombre}</div><span class="status ${c.Estado}">${c.Estado === 'VENCIDO'? 'VENCIDO' : (c.dias_restantes||0) + 'd'}</span><div class="paquete">${c.PaqueteActivo}</div><a href="https://wa.me/55${String(c.WhatsApp).replace(/\D/g,'')}" class="whatsapp">📱 ${c.WhatsApp}</a><div class="dato"><span>Cortes restantes:</span><span class="cortes-num">${c.CortesRestantes}/${c.CortesTotales}</span></div><div class="vencimiento">Vence: ${c.FechaVencimientoFormateada}</div><div class="acciones"><button class="btn-accion btn-corte" onclick="registrarCorte('${c.ID}')" ${c.CortesRestantes <= 0? 'disabled' : ''}>✂️ Corte</button><button class="btn-accion btn-renovar" onclick="renovar('${c.ID}')">🔄 Renovar</button></div></div>`).join('');
}
function filtrar(){ mostrarClientes(); }
function cambiarFiltro(f, b){ filtroActual=f; document.querySelectorAll('.filtro').forEach(x=>x.classList.remove('activo')); b.classList.add('activo'); mostrarClientes(); }
async function registrarCorte(id){ if(!confirm('¿Registrar corte?')) return; await api('registrarCorte',{id}); cargar(); }
async function renovar(id){ if(!confirm('¿Renovar?')) return; await api('renovarMembresia',{id}); cargar(); }
function abrirModal(){ document.getElementById('modalNuevo').classList.add('activo'); }
function cerrarModal(){ document.getElementById('modalNuevo').classList.remove('activo'); }
async function nuevoCliente(){ const d={Nombre:nome.value,WhatsApp:tel.value,PaqueteActivo:tipo.value,Observaciones:obs.value}; if(!d.Nombre||!d.WhatsApp) return alert('Falta datos'); await api('agregarCliente',d); cerrarModal(); cargar(); }
cargar();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('https://davidbarberstudio.github.io/sw.js'); }
</script>
</body>
</html>
