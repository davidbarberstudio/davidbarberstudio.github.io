<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DBM - Membresía VIP</title>
  <link rel="manifest" href="https://davidbarberstudio.github.io/manifest-membresia.json">
  <meta name="theme-color" content="#C9A96E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DBM">
  <link rel="icon" href="https://davidbarberstudio.github.io/dbm-icon-512.png">
  <link rel="apple-touch-icon" href="https://davidbarberstudio.github.io/dbm-icon-512.png">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; background: #000; }
    body { font-family: 'Montserrat', sans-serif; color: #fff; min-height: 100vh; padding-bottom: 120px; }
    .app { width: 100%; padding: 20px 16px; max-width: 800px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 2px solid #C9A96E; }
    .logo { width: 90px; height: auto; margin-bottom: 8px; }
    .buscador { display: flex; gap: 10px; margin-bottom: 20px; }
    .buscador input { flex: 1; padding: 14px 16px; border-radius: 12px; border: 2px solid #C9A96E; background: #111; color: #fff; font-size: 15px; }
    .btn-buscar { padding: 14px 18px; border-radius: 12px; border: 2px solid #C9A96E; background: #C9A96E; color: #000; font-weight: 700; }
    .filtros { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .filtro { padding: 12px 8px; border-radius: 20px; border: 2px solid #333; background: #111; color: #888; font-size: 13px; font-weight: 700; }
    .filtro.activo { background: #C9A96E; color: #000; border-color: #C9A96E; }
    .card-cliente { background: #0a0a0a; border: 1px solid #C9A96E; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .nombre { font-family: 'Cinzel', serif; font-weight: 700; font-size: 18px; color: #C9A96E; }
    .paquete { font-size: 12px; color: #aaa; margin-bottom: 10px; }
    .status { float: right; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
    .ACTIVO { background: #198754; } .PORVENCER { background: #FF8C00; color: #000; } .VENCIDO { background: #dc3545; }
    .whatsapp { color: #25D366; text-decoration: none; font-size: 13px; display: block; margin-bottom: 10px; font-weight: 600; }
    .dato { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
    .cortes-num { font-size: 20px; color: #C9A96E; font-weight: 700; }
    .vencimiento { font-size: 11px; color: #999; margin-bottom: 12px; }
    .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-accion { padding: 12px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; }
    .btn-corte { background: #198754; color: #fff; } .btn-renovar { background: #C9A96E; color: #000; }
    .fab { position: fixed; bottom: 20px; right: 16px; width: 56px; height: 56px; border-radius: 50%; background: #C9A96E; color: #000; border: 3px solid #000; font-size: 28px; box-shadow: 0 8px 20px rgba(201,169,110,0.7); }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 20; padding: 16px; }
    .modal.activo { display: flex; align-items: center; justify-content: center; }
    .modal-card { background: #0a0a0a; border: 2px solid #C9A96E; border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; }
    .modal-card h3 { font-family: 'Cinzel', serif; color: #C9A96E; margin-bottom: 16px; text-align: center; font-size: 18px; }
    .modal-card input, .modal-card select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 2px solid #C9A96E; background: #000; color: #fff; font-size: 14px; }
    .modal-botones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .btn-guardar { background: #198754; color: #fff; padding: 12px; border: none; border-radius: 10px; font-weight: 700; }
    .btn-cancelar { background: #333; color: #fff; padding: 12px; border: none; border-radius: 10px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <img src="https://i.ibb.co/5pWGBXK/1781697467655.png" class="logo" alt="DBM">
    </div>
    <div class="buscador">
      <input type="text" id="busca" placeholder="Buscar cliente" oninput="filtrar()">
      <button class="btn-buscar" onclick="filtrar()">🔍</button>
    </div>
    <div class="filtros">
      <button class="filtro activo" onclick="cambiarFiltro('TODOS', this)">Todos</button>
      <button class="filtro" onclick="cambiarFiltro('PORVENCER', this)">Por Vencer</button>
      <button class="filtro" onclick="cambiarFiltro('VENCIDO', this)">Vencidos</button>
    </div>
    <div id="listaClientes"></div>
  </div>
  <button class="fab" onclick="abrirModal()">+</button>
  <div id="modalNuevo" class="modal">
    <div class="modal-card">
      <h3>Nuevo Cliente</h3>
      <input id="nome" placeholder="Nombre completo">
      <input id="tel" placeholder="WhatsApp">
      <select id="tipo"><option value="Mensal 5 cortes">Mensal 5 cortes</option><option value="Promo 3 cortes">Promo 3 cortes</option></select>
      <input id="obs" placeholder="Observaciones">
      <div class="modal-botones">
        <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-guardar" onclick="nuevoCliente()">Guardar</button>
      </div>
    </div>
  </div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz8JaNuoYU7FQdswXy9p_sxROUVyoZZfMbJD4qzQBTlmATkPJB3wYltTmIiMrX4-PICOQ/exec";
let clientes = [], filtroActual = 'TODOS';
async function api(a,d={}){const u=`${SCRIPT_URL}?action=${a}&data=${encodeURIComponent(JSON.stringify(d))}&t=${Date.now()}`;const r=await fetch(u);return await r.json();}
async function cargar(){const c=await api('getConfig');document.getElementById('tipo').innerHTML=`<option value="${c.Paquete_1_Nombre||'Mensal 5 cortes'}">${c.Paquete_1_Nombre||'Mensal 5 cortes'}</option><option value="${c.Paquete_2_Nombre||'Promo 3 cortes'}">${c.Paquete_2_Nombre||'Promo 3 cortes'}</option>`;clientes=await api('getClientes');mostrar();}
function mostrar(){const div=document.getElementById('listaClientes');let l=clientes;const t=document.getElementById('busca').value.toLowerCase();if(t)l=l.filter(x=>x.Nombre.toLowerCase().includes(t));if(filtroActual!=='TODOS')l=l.filter(x=>x.Estado===filtroActual);div.innerHTML=l.map(c=>`<div class="card-cliente"><div class="nombre">${c.Nombre}</div><span class="status ${c.Estado}">${c.Estado}</span><div class="paquete">${c.PaqueteActivo}</div><a href="https://wa.me/55${c.WhatsApp.replace(/\D/g,'')}" class="whatsapp">📱 ${c.WhatsApp}</a><div class="dato"><span>Restantes:</span><span class="cortes-num">${c.CortesRestantes}/${c.CortesTotales}</span></div><div class="vencimiento">Vence: ${c.FechaVencimientoFormateada}</div><div class="acciones"><button class="btn-accion btn-corte" onclick="api('registrarCorte',{id:'${c.ID}'}).then(cargar)">✂️ Corte</button><button class="btn-accion btn-renovar" onclick="api('renovarMembresia',{id:'${c.ID}'}).then(cargar)">🔄 Renovar</button></div></div>`).join('');}
function filtrar(){mostrar();}
function cambiarFiltro(f,b){filtroActual=f;document.querySelectorAll('.filtro').forEach(x=>x.classList.remove('activo'));b.classList.add('activo');mostrar();}
function abrirModal(){document.getElementById('modalNuevo').classList.add('activo');}
function cerrarModal(){document.getElementById('modalNuevo').classList.remove('activo');}
async function nuevoCliente(){const d={Nombre:nome.value,WhatsApp:tel.value,PaqueteActivo:tipo.value,Observaciones:obs.value};await api('agregarCliente',d);cerrarModal();cargar();}
cargar();
if('serviceWorker' in navigator){navigator.serviceWorker.register('https://davidbarberstudio.github.io/sw.js');}
</script>
</body>
</html>
