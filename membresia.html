<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DB - VIP</title>
<link rel="icon" href="https://i.ibb.co/5pWGBXK/1781697467655.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#fff;font-family:Montserrat,sans-serif;padding-bottom:90px}
.header{text-align:center;padding:16px 0;border-bottom:2px solid #C9A96E}.logo{width:95px}
.buscador{padding:12px;display:flex;gap:8px}.buscador input{flex:1;padding:14px;border-radius:12px;border:2px solid #C9A96E;background:#111;color:#fff;font-size:16px}
.btn-buscar{padding:14px 18px;border-radius:12px;background:#C9A96E;border:none;font-weight:700}
.filtros{padding:0 12px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.filtro{padding:12px;border-radius:20px;border:2px solid #333;background:#111;color:#888;font-weight:700;font-size:12px}.filtro.activo{background:#C9A96E;color:#000;border-color:#C9A96E}
.card-cliente{width:100%;background:#0f0f0f;border:2px solid #C9A96E;border-radius:0;padding:18px 14px;margin-bottom:12px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.nombre{font-family:Cinzel;font-size:20px;color:#C9A96E;font-weight:700;max-width:60%;line-height:1.1}
.status{padding:8px 14px;border-radius:12px;font-size:13px;font-weight:800;min-width:90px;text-align:center}
.ACTIVO{background:#198754;color:#fff}.PORVENCER{background:#FFC107;color:#000}.VENCIDO{background:#dc3545;color:#fff}
.paquete{font-size:13px;color:#aaa;margin:8px 0 4px}.whatsapp{color:#25D366;font-weight:700;margin-bottom:10px;display:block}
.dato{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin:10px 0}.cortes-num{font-size:34px;color:#C9A96E;font-weight:800}.vencimiento{text-align:center;font-size:13px;color:#ddd;margin:10px 0 16px;font-weight:600}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn-accion{padding:16px;border-radius:12px;border:none;font-weight:700;font-size:15px}.btn-corte{background:#198754;color:#fff}.btn-renovar{background:#C9A96E;color:#000}
.fab{position:fixed;bottom:22px;right:22px;width:62px;height:62px;border-radius:50%;background:#C9A96E;color:#000;border:3px solid #000;font-size:32px;z-index:10}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:99;padding:14px}.modal.activo{display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="header"><img src="https://i.ibb.co/5pWGBXK/1781697467655.png" class="logo"><div style="font-family:Cinzel;color:#C9A96E;margin-top:6px">DBM<br><span style="font-family:Montserrat;font-size:10px;letter-spacing:3px;color:#888">MEMBRESÍA VIP</span></div></div>
<div class="buscador"><input id="busca" placeholder="Buscar cliente" oninput="filtrar()"><button class="btn-buscar" onclick="filtrar()">🔍</button></div>
<div class="filtros"><button class="filtro activo" onclick="cambiarFiltro('TODOS',this)">Todos</button><button class="filtro" onclick="cambiarFiltro('POR VENCER',this)">Por Vencer</button><button class="filtro" onclick="cambiarFiltro('VENCIDO',this)">Vencidos</button></div>
<div id="listaClientes" style="text-align:center;padding:40px;color:#666">Cargando...</div>
<button class="fab" onclick="abrirModal()">+</button>
<div id="modalNuevo" class="modal"><div style="background:#0a0a0a;border:2px solid #C9A96E;border-radius:16px;padding:20px;width:100%;max-width:400px"><h3 style="font-family:Cinzel;color:#C9A96E;text-align:center">Nuevo Cliente</h3><input id="nome" placeholder="Nombre" style="width:100%;padding:14px;margin:8px 0;border-radius:10px;border:2px solid #C9A96E;background:#000;color:#fff"><input id="tel" placeholder="WhatsApp" style="width:100%;padding:14px;margin:8px 0;border-radius:10px;border:2px solid #C9A96E;background:#000;color:#fff"><select id="tipo" style="width:100%;padding:14px;margin:8px 0;border-radius:10px;border:2px solid #C9A96E;background:#000;color:#fff"><option>Mensal 5 cortes</option><option>Promo 3 cortes</option></select><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button onclick="cerrarModal()" style="padding:12px;border-radius:10px;background:#333;color:#fff;border:none">Cancelar</button><button onclick="nuevoCliente()" style="padding:12px;border-radius:10px;background:#198754;color:#fff;border:none;font-weight:700">Guardar</button></div></div></div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbz8JaNuoYU7FQdswXy9p_sxROUVyoZZfMbJD4qzQBTlmATkPJB3wYltTmIiMrX4-PICOQ/exec";
let clientes=[],filtroActual='TODOS';
function apiJSONP(a,d={}){return new Promise((res,rej)=>{const cb='cb_'+Date.now()+Math.floor(Math.random()*1000);window[cb]=(x)=>{res(x);delete window[cb];s.remove()};const s=document.createElement('script');s.src=`${SCRIPT_URL}?action=${a}&data=${encodeURIComponent(JSON.stringify(d))}&callback=${cb}&v=10&_=${Date.now()}`;s.onerror=()=>rej();document.body.appendChild(s)})}
async function cargar(){try{const d=await apiJSONP('getClientes');clientes=Array.isArray(d)?d:[];mostrar()}catch(e){}}
function mostrar(){const div=document.getElementById('listaClientes');let l=[...clientes];const t=busca.value.toLowerCase();if(t)l=l.filter(c=>(c.Nombre||'').toLowerCase().includes(t));if(filtroActual==='POR VENCER')l=l.filter(c=>c.dias_restantes>0&&c.dias_restantes<=7);if(filtroActual==='VENCIDO')l=l.filter(c=>c.dias_restantes<=0);if(!l.length){div.innerHTML='No hay clientes';return}div.innerHTML=l.map(c=>{let dias=c.dias_restantes;let txt=dias<=0?'VENCIDO':dias+' días';let cls=dias<=0?'VENCIDO':dias<=7?'PORVENCER':'ACTIVO';return `<div class="card-cliente"><div class="card-top"><div class="nombre">${c.Nombre}</div><span class="status ${cls}">${txt}</span></div><div class="paquete">${c.PaqueteActivo||''}</div><div class="whatsapp">📱 ${c.WhatsApp}</div><div class="dato"><span>Cortes:</span><span class="cortes-num">${c.CortesRestantes||0}/${c.CortesTotales||0}</span></div><div class="vencimiento">Vence: ${c.FechaVencimientoFormateada} • Renov: ${c.Renovaciones||0}</div><div class="acciones"><button class="btn-accion btn-corte" onclick="registrarCorte('${c.ID}')">✂️ Corte</button><button class="btn-accion btn-renovar" onclick="renovar('${c.ID}','${c.PaqueteActivo}')">🔄 Renovar</button></div></div>`}).join('')}
function filtrar(){mostrar()}function cambiarFiltro(f,b){filtroActual=f;document.querySelectorAll('.filtro').forEach(x=>x.classList.remove('activo'));b.classList.add('activo');mostrar()}
async function registrarCorte(id){if(!confirm('¿Registrar corte?'))return;let r=await apiJSONP('registrarCorte',{id});if(r.error) alert(r.error); cargar()}
async function renovar(id,paq){if(!confirm('¿Renovar?'))return;await apiJSONP('renovarMembresia',{id,tipo:paq});cargar()}
function abrirModal(){modalNuevo.classList.add('activo')}function cerrarModal(){modalNuevo.classList.remove('activo')}
async function nuevoCliente(){const d={Nombre:nome.value,WhatsApp:tel.value,PaqueteActivo:tipo.value};if(!d.Nombre)return alert('Falta nombre');await apiJSONP('agregarCliente',d);cerrarModal();cargar()}
cargar();
</script>
</body>
</html>
