<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBM - VIP</title>
<link rel="icon" type="image/png" href="https://davidbarberstudio.github.io/dbm-icon-192.png">
<link rel="apple-touch-icon" href="https://davidbarberstudio.github.io/dbm-icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#fff;font-family:Montserrat,sans-serif;padding-bottom:90px}
.header{text-align:center;padding:16px 0;border-bottom:2px solid #C9A96E}.logo{width:110px}
.buscador{padding:12px;display:flex;gap:8px}.buscador input{flex:1;padding:14px;border-radius:12px;border:2px solid #C9A96E;background:#111;color:#fff}
.filtros{padding:0 12px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.filtro{padding:12px;border-radius:20px;border:2px solid #333;background:#111;color:#888;font-weight:700;font-size:12px}.filtro.activo{background:#C9A96E;color:#000;border-color:#C9A96E}
#listaClientes{padding:12px}.card-cliente{background:#0f0f0f;border:2px solid #C9A96E;border-radius:18px;padding:18px 16px;margin-bottom:14px}
.card-top{display:flex;justify-content:space-between}.nombre{font-family:Cinzel;font-size:19px;color:#C9A96E}.status{padding:8px 14px;border-radius:12px;font-size:12px;font-weight:800;min-width:70px;text-align:center}.ACTIVO{background:#198754;color:#fff}.PORVENCER{background:#FFC107;color:#000}.VENCIDO{background:#dc3545;color:#fff}
.whatsapp-link{color:#25D366;font-weight:700;margin:6px 0;display:block;text-decoration:none}
.cortes-num{font-size:36px;color:#C9A96E;font-weight:800}.acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn-accion{padding:14px;border-radius:12px;border:none;font-weight:700;font-size:13px}.btn-corte{background:#198754;color:#fff}.btn-renovar{background:#C9A96E;color:#000}
.fab{position:fixed;bottom:22px;right:22px;width:62px;height:62px;border-radius:50%;background:#C9A96E;color:#000;font-size:32px;border:none}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99;padding:14px;align-items:center;justify-content:center}.modal.activo{display:flex}.modal-box{background:#111;border:2px solid #C9A96E;border-radius:18px;padding:22px;width:100%;max-width:400px;text-align:center}
.preview{background:#000;border:1px solid #333;border-radius:12px;padding:14px;text-align:left;font-size:12px;color:#fff;white-space:pre-wrap;margin:12px 0;font-family:monospace}
.btn-whats{display:block;background:#25D366;color:#fff;padding:16px;border-radius:12px;font-weight:800;width:100%;margin-top:12px;font-size:16px;text-decoration:none;text-align:center}.btn-sec{background:#333;color:#fff;border:none;padding:12px;border-radius:12px;width:100%;margin-top:8px}
.input{width:100%;padding:14px;margin:6px 0;border-radius:10px;border:2px solid #C9A96E;background:#000;color:#fff}
</style>
</head>
<body>
<div class="header"><img src="https://i.ibb.co/5pWGBXK/1781697467655.png" class="logo"><div style="font-family:Cinzel;color:#C9A96E;margin-top:6px">DAVID BARBER STUDIO</div></div>
<div class="buscador"><input id="busca" placeholder="Buscar cliente" oninput="mostrar()"><button style="padding:14px 18px;border-radius:12px;background:#C9A96E;border:none" onclick="carregar()">🔍</button></div>
<div class="filtros"><button class="filtro activo" onclick="cambiarFiltro('TODOS',this)">Todos</button><button class="filtro" onclick="cambiarFiltro('POR VENCER',this)">Por Vencer</button><button class="filtro" onclick="cambiarFiltro('VENCIDO',this)">Vencidos</button></div>
<div id="listaClientes">Carregando...</div>
<button class="fab" onclick="document.getElementById('modalNovo').classList.add('activo')">+</button>
<div id="modalNovo" class="modal"><div class="modal-box"><h3 style="font-family:Cinzel;color:#C9A96E">Novo Cliente</h3>
<input id="nome" class="input" placeholder="Nome"><input id="tel" class="input" placeholder="WhatsApp"><select id="tipo" class="input"><option>Mensal 5 cortes</option><option>Promo 3 cortes</option></select><textarea id="obs" class="input" placeholder="Observações" rows="2"></textarea><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button onclick="document.getElementById('modalNovo').classList.remove('activo')" class="btn-sec">Cancelar</button><button onclick="novoCliente()" style="padding:12px;border-radius:10px;background:#198754;color:#fff;border:none">Salvar</button></div></div></div>
<div id="modalComprovante" class="modal"><div class="modal-box"><h3 id="compTitulo" style="font-family:Cinzel;color:#C9A96E">CORTE REGISTRADO!</h3><div id="compPreview" class="preview"></div><a id="btnEnviar" class="btn-whats" target="_blank" href="#">📱 Enviar no WhatsApp do Cliente</a><button class="btn-sec" onclick="document.getElementById('modalComprovante').classList.remove('activo')">Fechar</button></div></div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbz8JaNuoYU7FQdswXy9p_sxROUVyoZZfMbJD4qzQBTlmATkPJB3wYltTmIiMrX4-PICOQ/exec";
let clientes=[], filtroActual='TODOS';
async function api(action, data={}){
  try{
    let url = SCRIPT_URL + "?action=" + action + "&data=" + encodeURIComponent(JSON.stringify(data)) + "&_=" + Date.now();
    if(action==='getClientes') url = SCRIPT_URL + "?action=getClientes&_=" + Date.now();
    const res = await fetch(url); const text = await res.text();
    try{ if(text.trim().startsWith('{') || text.trim().startsWith('[')){ return JSON.parse(text);} else { const ini=text.indexOf('('); const fin=text.lastIndexOf(')'); if(ini>-1 && fin>-1) return JSON.parse(text.substring(ini+1, fin)); return JSON.parse(text);} }catch(e){ return []; }
  }catch(e){ return []; }
}
async function carregar(){ const d=await api('getClientes'); clientes=Array.isArray(d)?d:(d.clientes||[]); mostrar(); }
function mostrar(){
  const div=document.getElementById('listaClientes'); let l=[...clientes]; const t=document.getElementById('busca').value.toLowerCase();
  if(t)l=l.filter(c=>(c.Nome||c.Nombre||'').toLowerCase().includes(t));
  if(filtroActual==='POR VENCER')l=l.filter(c=>c.dias_restantes>0&&c.dias_restantes<=7&&(c.CortesRestantes||0)>0);
  if(filtroActual==='VENCIDO')l=l.filter(c=>c.dias_restantes<=0||(c.CortesRestantes||0)<=0);
  if(!l.length){div.innerHTML='<div style="padding:20px;text-align:center">Nenhum cliente</div>';return}
  div.innerHTML=l.map(c=>{
    let nome=c.Nome||c.Nombre; let cortes=c.CortesRestantes||0; let total=c.CortesTotales||5; let dias=c.dias_restantes;
    let txt=cortes<=0||dias<=0?'VENCIDO':dias+'d'; let cls=cortes<=0||dias<=0?'VENCIDO':dias<=7?'PORVENCER':'ACTIVO';
    let telOnly=(c.WhatsApp||'').toString().replace(/\D/g,''); let telLink=telOnly.length==10||telOnly.length==11?'55'+telOnly:telOnly;
    return `<div class="card-cliente"><div class="card-top"><div><div class="nombre">${nome}</div><div style="font-size:12px;color:#aaa">${c.PaqueteActivo||''} ${c.Observacoes?'- '+c.Observacoes:''}</div></div><span class="status ${cls}">${txt}</span></div><a class="whatsapp-link" href="https://wa.me/${telLink}" target="_blank">📱 ${c.WhatsApp}</a><div style="display:flex;justify-content:space-between;margin:10px 0"><span>Cortes:</span><span class="cortes-num">${cortes}/${total}</span></div><div style="font-size:13px;color:#aaa;margin-bottom:12px">Vence: ${c.FechaVencimientoFormateada}</div><div class="acoes"><button class="btn-accion btn-corte" onclick="registrarCorte('${c.ID}')">✂️ Corte</button><button class="btn-accion btn-renovar" onclick="renovar('${c.ID}','${c.PaqueteActivo||''}')">🔄 Renovar</button></div></div>`;
  }).join('');
}
function cambiarFiltro(f,b){filtroActual=f;document.querySelectorAll('.filtro').forEach(x=>x.classList.remove('activo'));b.classList.add('activo');mostrar()}
function getClienteById(id){return clientes.find(c=>c.ID===id)}

async function registrarCorte(id){
  if(!confirm('Registrar corte?'))return;
  // Guardamos total antes para detectar si es el primer corte
  let cAntes=getClienteById(id);
  let totalAntes=cAntes?cAntes.CortesTotales:5;
  let cortesAntes=cAntes?cAntes.CortesRestantes:0;

  await api('registrarCorte',{id});
  await carregar();
  let c=getClienteById(id);
  if(c) comprovanteCorte(c, cortesAntes, totalAntes);
}
async function renovar(id,paq){
  if(!confirm('Renovar membresia?'))return;
  await api('renovarMembresia',{id,tipo:paq});
  await carregar();
  // YA NO MUESTRA MENSAJE AL RENOVAR, SOLO RECARGA
}
async function novoCliente(){ const d={Nombre:document.getElementById('nome').value,WhatsApp:document.getElementById('tel').value,PaqueteActivo:document.getElementById('tipo').value,Observacoes:document.getElementById('obs').value}; if(!d.Nombre)return alert('Falta nome'); await api('agregarCliente',d); document.getElementById('modalNovo').classList.remove('activo'); carregar(); }

function comprovanteCorte(c, cortesAntes, totalAntes){
  const nome=c.Nome||c.Nombre; const cortes=c.CortesRestantes||0; const total=c.CortesTotales||5;
  const vence=c.FechaVencimientoFormateada;
  const hoje=new Date().toLocaleDateString('pt-BR');
  // La fecha de inicio la sacamos del vencimiento menos 30 dias aprox, o usamos hoy si es renovacion
  const inicio = c.FechaInicioFormateada || hoje;
  let bol=''; for(let i=0;i<total;i++) bol+= i<(total-cortes)?'●':'○';

  let esPrimerCorte = (cortesAntes === totalAntes); // si antes tenia todos, este es el primero
  let texto=''; let titulo='CORTE REGISTRADO!';

  if(cortes<=0){
    // ULTIMO CORTE - MENSAJE QUE YA TENIAS
    titulo='PACOTE FINALIZADO!';
    texto=`*DAVID BARBER STUDIO* 👑💈
*COMPROVANTE - ULTIMO CORTE*

*Cliente:* ${nome}
*Data do corte:* ${hoje}
*Cortes:* *${cortes} de ${total}* ${bol}
*Vencimento:* ${vence}

*Seus cortes acabaram!* 😔
Obrigado por fazer parte da familia David Barber Studio! Foi um prazer te atender.
Que tal renovar seu pacote VIP e continuar com estilo impecavel? 💈✂️

Te esperamos em breve!
@davidbarberstudio.br`;
  } else if(esPrimerCorte){
    // PRIMER CORTE DESPUES DE RENOVAR - NUEVO MENSAJE ESPECIAL QUE PEDISTE
    titulo='BEM-VINDO DE VOLTA!';
    texto=`*DAVID BARBER STUDIO* 👑💈
*PACOTE RENOVADO - BEM-VINDO DE VOLTA!*

*Cliente:* ${nome}
*Pacote:* ${c.PaqueteActivo||''}
*Inicio do pacote:* ${inicio}
*Data do corte:* ${hoje}
*Vencimento:* ${vence}
*Restam:* *${cortes} de ${total} cortes* ${bol}

Muito obrigado por renovar e continuar fazendo parte da familia David Barber Studio! 🙏
É uma honra ter você com a gente. Seu novo ciclo começou hoje!

Aproveite seu estilo VIP! ✂️

@davidbarberstudio.br`;
  } else {
    // CORTE NORMAL - IGUAL AL DE TU FOTO
    texto=`*DAVID BARBER STUDIO* 👑💈
*COMPROVANTE DE CORTE*

*Cliente:* ${nome}
*Data:* ${hoje}
*Restam:* *${cortes} de ${total} cortes* ${bol}
*Vencimento:* ${vence}

Obrigado por escolher David Barber Studio!
Aproveite seu estilo VIP! ✂️

@davidbarberstudio.br`;
  }
  abrirModal(c,texto,titulo);
}

function abrirModal(cliente,texto,titulo){
  let tel=(cliente.WhatsApp||'').toString().replace(/\D/g,''); if(tel.length==10||tel.length==11) tel='55'+tel;
  const url='https://wa.me/'+tel+'?text='+encodeURIComponent(texto);
  document.getElementById('compTitulo').innerText=titulo;
  document.getElementById('compPreview').innerText=texto;
  document.getElementById('btnEnviar').href=url;
  document.getElementById('modalComprovante').classList.add('activo');
}
carregar();
</script>
</body>
</html>
