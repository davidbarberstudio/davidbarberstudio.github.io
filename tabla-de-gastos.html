<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabla de Gastos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f172a%22/><text y=%22.9em%22 x=%2250%%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2260%22>💳</text></svg>">
<meta name="theme-color" content="#0f172a">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f1f5f9;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;padding-bottom:100px;overflow-x:hidden}
.header{text-align:center;padding:22px 16px;background:#0f172a;color:#fff;border-bottom:4px solid #38bdf8}
.wrap{max-width:500px;margin:0 auto;padding:12px;overflow-x:hidden}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);overflow:hidden}
.row{display:flex;gap:8px;width:100%}
.row.input{min-width:0}
.input{flex:1;padding:12px;border-radius:10px;border:2px solid #e2e8f0;background:#f8fafc;color:#0f172a;outline:none;font-size:14px;width:100%}
.input:focus{border-color:#38bdf8}
.btn{padding:12px;border-radius:10px;border:none;font-weight:700;cursor:pointer;width:100%;margin-top:8px;font-size:13px}
.btn-blue{background:#0f172a;color:#fff}
.btn-green{background:#16a34a;color:#fff}
.btn-red{background:#fee2e2;color:#dc2626;border:1px solid #fecaca}
.btn-light{background:#f1f5f9;color:#0f172a;border:1px solid #e2e8f0}
.week{display:flex;justify-content:space-between;align-items:center;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:14px;background:#fff}
.parcelas-row{display:flex;gap:6px}
.parcelas-row.input{padding:10px;font-size:13px}
.small{font-size:11px;color:#64748b}
.debt-card{background:#fff;border:2px solid #0f172a;border-radius:14px;padding:14px;margin-top:12px}
</style>
</head>
<body>
<div class="header"><h1>💳 TABLA DE GASTOS</h1><p>Personal • con parcelas</p></div>
<div class="wrap">
<div class="week"><button class="btn" style="width:42px;background:#e2e8f0;color:#0f172a;margin:0" onclick="cambiarSemana(-1)">‹</button><span id="semanaLabel">Cargando...</span><button class="btn" style="width:42px;background:#e2e8f0;color:#0f172a;margin:0" onclick="cambiarSemana(1)">›</button></div>

<div class="card">
<h3 style="font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">Ingreso de la semana</h3>
<div class="row"><input id="ingreso" class="input" type="number" placeholder="Ej: 1500"><button class="btn btn-green" style="width:80px;margin:0" onclick="guardarIngreso()">Guardar</button></div>
<div id="saldo" style="font-size:28px;font-weight:800;text-align:center;margin:8px 0">R$ 0,00</div>
<div style="display:flex;justify-content:space-between;font-size:11px;color:#64748b"><span id="totalGastosTxt">Gastos: R$ 0</span><span id="sobraTxt">Te queda: R$ 0</span></div>
</div>

<div class="card">
<h3 style="font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">Agregar Gasto</h3>
<div class="row" style="margin-bottom:8px"><input id="descGasto" class="input" placeholder="Descripción"><input id="valorGasto" class="input" type="number" placeholder="R$" style="max-width:95px"></div>
<select id="catGasto" class="input" style="width:100%;margin-bottom:8px"><option>Supermercado</option><option>Casa</option><option>Transporte</option><option>Comida</option><option>Otros</option></select>
<button class="btn btn-blue" onclick="agregarGasto()">AGREGAR GASTO</button>
<div id="listaGastos"></div>
</div>

<div class="card">
<h3 style="font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px">📋 Mis Deudas</h3>
<p class="small" style="margin-bottom:8px">Solo valor total, o en parcelas.</p>
<input id="nombreDeuda" class="input" placeholder="Que debes? Ej: Bicicleta" style="width:100%;margin-bottom:8px">
<input id="valorDeuda" class="input" type="number" placeholder="Valor total Ej: 1300" style="width:100%;margin-bottom:8px">
<div style="background:#f1f5f9;border-radius:10px;padding:10px;margin-bottom:8px">
<div class="small" style="margin-bottom:6px">¿En parcelas? (opcional)</div>
<div class="parcelas-row">
<input id="numParcelas" class="input" type="number" placeholder="N° Ej: 10">
<input id="valorParcela" class="input" type="number" placeholder="Valor Ej: 130">
</div>
<div id="calcParcelas" class="small" style="margin-top:6px;color:#0284c7"></div>
</div>
<button class="btn btn-blue" onclick="agregarDeuda()">AGREGAR DEUDA</button>
<div id="listaDeudas"></div>
<div id="totalDeudas" style="background:#0f172a;color:#fff;border-radius:12px;padding:12px;text-align:center;font-weight:800;margin-top:12px">Total debiendo: R$ 0</div>
</div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyp_Jn9Fr4pM3D8jCCaGx8QREN2RAQlh_F9T8cr0BMtkkKmxv3qUqwYm5jil--bxgJO/exec";
let datos={gastos:[],ingresos:[],deudas:[],pagos:[]}; let offsetSemana=0;
function semanaKey(off){const d=new Date(); d.setDate(d.getDate()+off*7); const y=d.getFullYear(); const w=Math.ceil((((d - new Date(y,0,1))/86400000)+new Date(y,0,1).getDay()+1)/7); return y+'-W'+w;}
function semanaLabel(off){const d=new Date(); d.setDate(d.getDate()+off*7); return 'Semana de '+d.toLocaleDateString('es-ES');}
function cambiarSemana(dir){offsetSemana+=dir; render();}
document.getElementById('numParcelas').addEventListener('input', calc); document.getElementById('valorParcela').addEventListener('input', calc);
function calc(){const n=parseFloat(document.getElementById('numParcelas').value)||0; const v=parseFloat(document.getElementById('valorParcela').value)||0; if(n&&v){ document.getElementById('calcParcelas').innerText=n+' x R$ '+v+' = R$ '+(n*v).toFixed(2); document.getElementById('valorDeuda').value=(n*v).toFixed(2);} else document.getElementById('calcParcelas').innerText='';}
async function cargarDatos(){try{document.getElementById('semanaLabel').innerText='Cargando...'; const r=await fetch(SCRIPT_URL+'?action=getData'); datos=await r.json(); render();}catch(e){document.getElementById('semanaLabel').innerText='Error';}}
function render(){const key=semanaKey(offsetSemana); document.getElementById('semanaLabel').innerText=semanaLabel(offsetSemana); const ingresoSemana=datos.ingresos.find(i=>i[1]==key); document.getElementById('ingreso').value=ingresoSemana?ingresoSemana[2]:''; const gastosSemana=datos.gastos.filter(g=>g[1]==key); const totalGastos=gastosSemana.reduce((s,g)=>s+parseFloat(g[3]||0),0); const ingresoVal=parseFloat(document.getElementById('ingreso').value)||(ingresoSemana?parseFloat(ingresoSemana[2]):0); const saldo=ingresoVal-totalGastos; document.getElementById('totalGastosTxt').innerText='Gastos: R$ '+totalGastos.toFixed(2); document.getElementById('sobraTxt').innerText='Te queda: R$ '+saldo.toFixed(2); document.getElementById('saldo').innerText='R$ '+saldo.toFixed(2); const listaG=document.getElementById('listaGastos'); if(!gastosSemana.length) listaG.innerHTML='<div style="color:#94a3b8;font-size:12px;text-align:center;padding:12px">Sin gastos</div>'; else listaG.innerHTML=gastosSemana.map(g=>`<div style="display:flex;justify-content:space-between;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-top:8px;font-size:13px"><div><b>${g[2]}</b><div style="color:#94a3b8;font-size:11px">${new Date(g[0]).toLocaleDateString('es-ES')}</div></div><div style="font-weight:800">R$ ${g[3]}</div></div>`).reverse().join(''); renderDeudas();}
function renderDeudas(){const cont=document.getElementById('listaDeudas'); if(!datos.deudas.length){cont.innerHTML='<div style="color:#94a3b8;font-size:12px;text-align:center;padding:12px">Sin deudas</div>'; document.getElementById('totalDeudas').innerText='Total debiendo: R$ 0'; return;} let totalGeneral=0; cont.innerHTML=datos.deudas.map(d=>{const id=d[0]; const nombre=d[1]; const valorTotal=parseFloat(d[2]); const estado=d[4]||'ABIERTA'; const numParc=parseFloat(d[5])||0; const valParc=parseFloat(d[6])||0; const pagos=datos.pagos.filter(p=>p[0].toString()==id.toString()); const pagado=pagos.reduce((s,p)=>s+parseFloat(p[2]||0),0); const queda=valorTotal-pagado; if(queda>0) totalGeneral+=queda; const pagadas=pagos.length; const faltan=numParc?Math.max(0,numParc-pagadas):0; const hist=pagos.length?pagos.map(p=>`<div style="font-size:11px;color:#64748b;display:flex;justify-content:space-between;border-bottom:1px solid #e2e8f0;padding:5px 0"><span>${new Date(p[3]).toLocaleDateString('es-ES')}</span><span>- R$ ${p[2]}</span></div>`).reverse().join(''):'<div style="color:#94a3b8;font-size:11px">Sin abonos</div>'; let infoParc=''; if(numParc) infoParc=`<div style="background:#e0f2fe;border:1px solid #bae6fd;border-radius:8px;padding:8px;font-size:11px;color:#0c4a6e;margin:8px 0;display:flex;justify-content:space-between"><span>📦 ${numParc} x R$ ${valParc.toFixed(2)}</span><span><b>${pagadas}</b> pagas | faltan ${faltan}</span></div>`; return `<div class="debt-card"><div style="display:flex;justify-content:space-between"><div style="font-weight:800">${nombre}</div><span style="font-size:10px;background:#e0f2fe;padding:3px 6px;border-radius:5px;color:#0284c7">${estado}</span></div><div style="font-size:11px;color:#64748b">Total: R$ ${valorTotal.toFixed(2)} | Pagado: R$ ${pagado.toFixed(2)}</div>${infoParc}<div style="font-size:18px;font-weight:800;margin:6px 0;color:${queda<=0?'#16a34a':'#0f172a'}">${queda<=0?'¡PAGADA! 🎉':'Queda: R$ '+queda.toFixed(2)+(numParc?' ('+faltan+' parcelas)':'')}</div><div style="background:#fff;border-radius:8px;padding:8px;margin:8px 0;max-height:110px;overflow:auto;border:1px solid #e2e8f0">${hist}</div><div class="row"><input id="pago-${id}" class="input" type="number" placeholder="${valParc?'R$ '+valParc:'Abono'}" value="${valParc?valParc:''}"><button class="btn btn-green" style="width:80px;margin:0" onclick="abonar('${id}')">Pagar</button></div><div class="row" style="margin-top:8px"><button class="btn btn-light" style="margin:0" onclick="editarDeuda('${id}')">✏️ Editar</button><button class="btn btn-red" style="margin:0" onclick="eliminarDeuda('${id}')">🗑️ Eliminar</button></div><div id="edit-${id}" style="display:none;background:#f8fafc;border:2px dashed #38bdf8;border-radius:10px;padding:10px;margin-top:8px"><input id="edit-nombre-${id}" class="input" value="${nombre}" style="margin-bottom:6px"><div class="row" style="margin-bottom:6px"><input id="edit-total-${id}" class="input" type="number" value="${valorTotal}"><input id="edit-num-${id}" class="input" type="number" value="${numParc||''}" placeholder="Parcelas"></div><input id="edit-valparc-${id}" class="input" type="number" value="${valParc||''}" placeholder="Valor parcela" style="margin-bottom:6px"><div class="row"><button class="btn btn-blue" style="margin:0" onclick="guardarEdicion('${id}')">Guardar</button><button class="btn btn-light" style="margin:0" onclick="document.getElementById('edit-${id}').style.display='none'">Cancelar</button></div></div></div>`;}).reverse().join(''); document.getElementById('totalDeudas').innerText='Total debiendo: R$ '+totalGeneral.toFixed(2);}
async function postear(p){const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(p)}); return await r.json();}
async function guardarIngreso(){const k=semanaKey(offsetSemana); const v=parseFloat(document.getElementById('ingreso').value)||0; if(!v) return alert('Pon valor'); document.getElementById('semanaLabel').innerText='Guardando...'; await postear({action:'addIngreso',semana:k,valor:v}); await cargarDatos();}
async function agregarGasto(){const d=document.getElementById('descGasto').value.trim(); const v=parseFloat(document.getElementById('valorGasto').value)||0; const c=document.getElementById('catGasto').value; if(!d||!v) return alert('Completa'); document.getElementById('semanaLabel').innerText='Guardando...'; await postear({action:'addGasto',semana:semanaKey(offsetSemana),descripcion:d,valor:v,categoria:c}); document.getElementById('descGasto').value=''; document.getElementById('valorGasto').value=''; await cargarDatos();}
async function agregarDeuda(){const n=document.getElementById('nombreDeuda').value.trim(); let t=parseFloat(document.getElementById('valorDeuda').value)||0; const np=parseFloat(document.getElementById('numParcelas').value)||0; const vp=parseFloat(document.getElementById('valorParcela').value)||0; if(np&&vp) t=np*vp; if(!n||!t) return alert('Pon nombre y total'); document.getElementById('semanaLabel').innerText='Guardando...'; await postear({action:'addDeuda',nombre:n,valorTotal:t,numParcelas:np,valorParcela:vp}); document.getElementById('nombreDeuda').value=''; document.getElementById('valorDeuda').value=''; document.getElementById('numParcelas').value=''; document.getElementById('valorParcela').value=''; document.getElementById('calcParcelas').innerText=''; await cargarDatos();}
async function abonar(id){const i=document.getElementById('pago-'+id); const v=parseFloat(i.value)||0; if(!v) return alert('Pon cuanto'); document.getElementById('semanaLabel').innerText='Guardando...'; await postear({action:'addPago',idDeuda:id,valorPagado:v}); i.value=''; await cargarDatos();}
async function eliminarDeuda(id){if(!confirm('¿Eliminar?')) return; document.getElementById('semanaLabel').innerText='Eliminando...'; await postear({action:'deleteDeuda',idDeuda:id}); await cargarDatos();}
function editarDeuda(id){document.getElementById('edit-'+id).style.display='block';}
async function guardarEdicion(id){const n=document.getElementById('edit-nombre-'+id).value.trim(); const t=parseFloat(document.getElementById('edit-total-'+id).value)||0; const np=parseFloat(document.getElementById('edit-num-'+id).value)||0; const vp=parseFloat(document.getElementById('edit-valparc-'+id).value)||0; if(!n||!t) return alert('Completa'); document.getElementById('semanaLabel').innerText='Guardando...'; await postear({action:'editDeuda',idDeuda:id,nombre:n,valorTotal:t,numParcelas:np,valorParcela:vp}); await cargarDatos();}
cargarDatos();
</script>
</body>
</html>
